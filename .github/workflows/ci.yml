name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t trek-amap-adapter:test .
      - run: docker compose -f docker-compose.example.yml config --quiet
        env:
          AMAP_KEY: ci-placeholder
      - name: Verify container health
        run: |
          docker run -d --name adapter -e AMAP_KEY=ci-placeholder -p 127.0.0.1:8080:8080 trek-amap-adapter:test
          timeout 30 bash -c 'until curl --fail --silent http://127.0.0.1:8080/health; do sleep 1; done'
      - if: always()
        run: docker logs adapter
